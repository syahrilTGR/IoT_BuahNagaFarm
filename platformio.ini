; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
;   Custom command shortcuts for quick access
;
;   Compile & upload via standard PlatformIO commands
;   pio run -e <environment>       # Build only
;   pio run -t upload -e <environment> # Build + Upload
;   pio monitor -e <environment>     # Open serial monitor
;
;   Per-environment commands:
;     [env:esp32dev]
;       pio run -e esp32dev                  # Build production firmware
;       pio run -t upload -e esp32dev        # Upload production firmware
;       pio monitor -e esp32dev              # Monitor production firmware
;
;     [env:test_platform]
;       pio run -e test_platform             # Build test firmware (WiFi + Firebase + LED)
;       pio run -t upload -e test_platform   # Upload + test firmware
;       pio monitor -e test_platform         # Monitor test firmware
;
;   Quick shortcuts (add to shell)
;   alias pio="~/.platformio/penv/bin/pio"
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
	mandulaj/PZEM-004T-v30
	tzapu/WiFiManager
	bblanchon/ArduinoJson
	adafruit/Adafruit SSD1306
	knolleary/PubSubClient
	mobizt/Firebase Arduino Client Library for ESP8266 and ESP32@^4.4.17
build_flags =
	-DCORE_DEBUG_LEVEL=3
	-DBOARD_HAS_PSRAM
build_src_filter =
	+<main.cpp>
	-<test_platform.cpp>

[env:test_platform]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
	-DCORE_DEBUG_LEVEL=3
	-DBOARD_HAS_PSRAM
lib_deps =
	bblanchon/ArduinoJson
	tzapu/WiFiManager
	mobizt/Firebase Arduino Client Library for ESP8266 and ESP32@^4.4.17
build_src_filter =
	+<test_platform.cpp>
	-<main.cpp>
