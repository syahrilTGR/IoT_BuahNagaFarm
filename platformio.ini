; =============================================================================
; PLATFORMIO PROJECT CONFIGURATION & CLI CHEATSHEET
; =============================================================================
;
; PATH EXECUTABLE DEFAULT (VS Code Extension):
;   Windows (PowerShell) : & "$env:USERPROFILE\.platformio\penv\Scripts\pio.exe"
;   Windows (CMD)        : "%USERPROFILE%\.platformio\penv\Scripts\pio.exe"
;   macOS / Linux (Bash) : ~/.platformio/penv/bin/pio
;
; =============================================================================
; 1. ENVIRONMENT: esp32dev (Production Firmware)
; =============================================================================
; [WINDOWS - PowerShell]
;   Build Only   : & "$env:USERPROFILE\.platformio\penv\Scripts\pio.exe" run -e esp32dev
;   Upload USB   : & "$env:USERPROFILE\.platformio\penv\Scripts\pio.exe" run -t upload -e esp32dev
;   Upload OTA   : & "$env:USERPROFILE\.platformio\penv\Scripts\pio.exe" run -t upload -e esp32dev --upload-port 192.168.x.x
;   Serial Mon   : & "$env:USERPROFILE\.platformio\penv\Scripts\pio.exe" monitor -e esp32dev
;   Upload & Mon : & "$env:USERPROFILE\.platformio\penv\Scripts\pio.exe" run -t upload -e esp32dev; & "$env:USERPROFILE\.platformio\penv\Scripts\pio.exe" monitor -e esp32dev
;
; [WINDOWS - Command Prompt (CMD)]
;   Build Only   : "%USERPROFILE%\.platformio\penv\Scripts\pio.exe" run -e esp32dev
;   Upload USB   : "%USERPROFILE%\.platformio\penv\Scripts\pio.exe" run -t upload -e esp32dev
;   Upload OTA   : "%USERPROFILE%\.platformio\penv\Scripts\pio.exe" run -t upload -e esp32dev --upload-port 192.168.x.x
;   Serial Mon   : "%USERPROFILE%\.platformio\penv\Scripts\pio.exe" monitor -e esp32dev
;
; [macOS / Linux - Terminal (Bash/Zsh)]
;   Build Only   : ~/.platformio/penv/bin/pio run -e esp32dev
;   Upload USB   : ~/.platformio/penv/bin/pio run -t upload -e esp32dev
;   Upload OTA   : ~/.platformio/penv/bin/pio run -t upload -e esp32dev --upload-port 192.168.x.x
;   Serial Mon   : ~/.platformio/penv/bin/pio monitor -e esp32dev
;   Upload & Mon : ~/.platformio/penv/bin/pio run -t upload -e esp32dev && ~/.platformio/penv/bin/pio monitor -e esp32dev
;
; =============================================================================
; 2. ENVIRONMENT: test_platform (Test Firmware - WiFi + Firebase + LED)
; =============================================================================
; [WINDOWS - PowerShell]
;   Build Only   : & "$env:USERPROFILE\.platformio\penv\Scripts\pio.exe" run -e test_platform
;   Upload       : & "$env:USERPROFILE\.platformio\penv\Scripts\pio.exe" run -t upload -e test_platform
;   Serial Mon   : & "$env:USERPROFILE\.platformio\penv\Scripts\pio.exe" monitor -e test_platform
;   Upload & Mon : & "$env:USERPROFILE\.platformio\penv\Scripts\pio.exe" run -t upload -e test_platform; & "$env:USERPROFILE\.platformio\penv\Scripts\pio.exe" monitor -e test_platform
;
; [WINDOWS - Command Prompt (CMD)]
;   Build Only   : "%USERPROFILE%\.platformio\penv\Scripts\pio.exe" run -e test_platform
;   Upload       : "%USERPROFILE%\.platformio\penv\Scripts\pio.exe" run -t upload -e test_platform
;   Serial Mon   : "%USERPROFILE%\.platformio\penv\Scripts\pio.exe" monitor -e test_platform
;
; [macOS / Linux - Terminal (Bash/Zsh)]
;   Build Only   : ~/.platformio/penv/bin/pio run -e test_platform
;   Upload       : ~/.platformio/penv/bin/pio run -t upload -e test_platform
;   Serial Mon   : ~/.platformio/penv/bin/pio monitor -e test_platform
;   Upload & Mon : ~/.platformio/penv/bin/pio run -t upload -e test_platform && ~/.platformio/penv/bin/pio monitor -e test_platform
;
; =============================================================================
; Opsional (Membuat alias agar cukup ketik 'pio'):
;   Windows (PowerShell Profile):
;     Set-Alias -Name pio -Value "$env:USERPROFILE\.platformio\penv\Scripts\pio.exe"
;   macOS / Linux (~/.zshrc atau ~/.bashrc):
;     alias pio="~/.platformio/penv/bin/pio"
; =============================================================================

[env:esp32dev]
platform = espressif32
board = esp32dev
board_build.flash_size = 4MB
board_build.flash_mode = dio
board_build.partitions = min_spiffs.csv
framework = arduino
monitor_speed = 115200
lib_deps = 
	mandulaj/PZEM-004T-v30
	tzapu/WiFiManager
	bblanchon/ArduinoJson
	adafruit/Adafruit SSD1306
	knolleary/PubSubClient
	mobizt/Firebase Arduino Client Library for ESP8266 and ESP32@^4.4.17
	adafruit/RTClib@^2.1.4
build_flags =
	-DCORE_DEBUG_LEVEL=3
	-DBOARD_HAS_PSRAM
build_src_filter =
	+<main.cpp>
	-<test_platform.cpp>
	-<test_zmpt.cpp>

; ── Template Konfigurasi OTA (Uncomment jika ingin upload default via WiFi) ───
; upload_protocol = espota
; upload_port = 192.168.1.50   ; Ganti dengan IP aktual ESP32 atau 'smartnaga-esp32.local'
; upload_flags =
; 	--port=3232

[env:test_platform]
platform = espressif32
board = esp32dev
board_build.flash_size = 4MB
board_build.flash_mode = dio
board_build.partitions = min_spiffs.csv
framework = arduino
monitor_speed = 115200
build_flags =
	-DCORE_DEBUG_LEVEL=3
	-DBOARD_HAS_PSRAM
lib_deps =
	bblanchon/ArduinoJson
	tzapu/WiFiManager
	mobizt/Firebase Arduino Client Library for ESP8266 and ESP32@^4.4.17
	adafruit/RTClib@^2.1.4
build_src_filter =
	+<test_platform.cpp>
	-<main.cpp>
	-<test_zmpt.cpp>

; =============================================================================
; 3. ENVIRONMENT: test_zmpt (ZMPT101B Hardware Diagnostic)
; =============================================================================
; Upload & monitor: pio run -t upload -e test_zmpt; pio monitor -e test_zmpt
; =============================================================================
[env:test_zmpt]
platform = espressif32
board = esp32dev
board_build.flash_size = 4MB
board_build.flash_mode = dio
board_build.partitions = min_spiffs.csv
framework = arduino
monitor_speed = 115200
build_src_filter =
	+<test_zmpt.cpp>
	-<main.cpp>
	-<test_platform.cpp>
